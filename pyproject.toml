[build-system]
requires = ["setuptools>=77,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "cs182-project"
version = "0.1.0"
description = "Model archival, inference, and activation collection for CS 182"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
modal = [
    "boto3==1.38.23",
    "modal==1.6.4",
]
seed = [
    "boto3==1.38.23",
    "huggingface-hub==0.30.2",
]
runtime = [
    "cs182-project[seed]",
    "torch==2.6.0",
    "transformers==4.51.3",
    "safetensors==0.5.3",
    "pyarrow==19.0.1",
]

[tool.setuptools.packages.find]
include = ["cs182_project*"]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu124", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
