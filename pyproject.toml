[build-system]
requires = ["setuptools>=77,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "cs182-project"
version = "0.1.0"
description = "Model archival, inference, and activation collection for CS 182"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = [
    "boto3-stubs[codebuild,ecr,logs,s3,sts]==1.38.23",
    "pyright>=1.1.400",
    "ruff>=0.12",
]

[project.optional-dependencies]
training = [
    "cs182-project[runtime]",
    "peft==0.10.0",
    "accelerate==0.28.0",
]
analysis = [
    "boto3==1.38.23",
    "numpy>=1.26",
    "pyarrow==19.0.1",
    "scikit-learn>=1.5,<2",
    "plotly>=6,<8",
]
build = [
    "boto3==1.38.23",
]
modal = [
    "boto3==1.38.23",
    "modal==1.6.4",
]
seed = [
    "boto3==1.38.23",
    "huggingface-hub==0.30.2",
    "pyarrow==19.0.1",
]
runtime = [
    "cs182-project[seed]",
    "torch==2.6.0",
    "transformers==4.37.2",
    "tiktoken==0.7.0",
    "einops==0.8.1",
    "transformers-stream-generator==0.0.4",
    "safetensors==0.5.3",
    "pyarrow==19.0.1",
]

[tool.setuptools.package-data]
cs182_project = ["third_party/refusal_direction/*"]

[tool.setuptools.packages.find]
include = ["cs182_project*"]

[tool.ruff]
include = ["cs182_project/**/*.py"]
extend-exclude = ["infra"]
force-exclude = true
target-version = "py310"
line-length = 100

[tool.ruff.lint]
extend-select = ["I", "ANN001", "ANN002", "ANN003", "ANN201", "ANN202", "ANN204"]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu124", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
