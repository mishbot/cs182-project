[project]
name = "cs182-analysis-runtime"
version = "0.1.0"
requires-python = "==3.11.*"
dependencies = [
    "cs182-project[analysis]",
    "cuml-cu12==26.10.0",
    "scikit-learn==1.9.1",
]

[tool.uv]
package = false
index-strategy = "unsafe-best-match"

[tool.uv.sources]
cs182-project = { path = "../.." }

[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com"
